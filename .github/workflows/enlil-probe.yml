name: ENLIL probe
on: { workflow_dispatch: {}, push: { branches: [main], paths: ['.github/workflows/enlil-probe.yml'] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://services.swpc.noaa.gov/images/animations/enlil/
          curl -s -D /tmp/h -o /tmp/l -H 'Origin: https://ori0nori0ff.github.io' $B; grep -i -E '^HTTP|access-control' /tmp/h; wc -c /tmp/l
          grep -o -E 'enlil_com2_[0-9]+_[0-9]{8}T[0-9]{6}\.jpg' /tmp/l | sort -u > /tmp/f; wc -l /tmp/f; head -3 /tmp/f; tail -3 /tmp/f
          echo runs:; sed -E 's/enlil_com2_([0-9]+)_.*/\1/' /tmp/f | sort | uniq -c | tail -20
          echo current:; curl -s https://services.swpc.noaa.gov/products/animations/enlil.json | python3 -c "import json,sys;a=json.load(sys.stdin);print(len(a),a[0]['url'],a[-1]['url'])"
          for u in "https://services.swpc.noaa.gov/products/animations/" "https://services.swpc.noaa.gov/json/"; do echo "== $u"; curl -s "$u" | grep -o -i 'enlil[^"<]*' | sort -u | head -20; done
          echo "== ts"; curl -s https://services.swpc.noaa.gov/json/enlil_time_series.json | python3 -c "import json,sys;a=json.load(sys.stdin);print(len(a),a[0]['time_tag'],a[-1]['time_tag'])"
