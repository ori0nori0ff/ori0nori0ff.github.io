# Hourly: frame lists for the aurora page's Sun loops (NASA allows no browser requests). Every 3 h (and on
# demand) also 48-hour MP4 clips per filter, uploaded to the "sun-clips" release (kept out of git history).
name: Sun frames
on:
  schedule: [{ cron: '23 * * * *' }, { cron: '53 * * * *' }]   # two slots: GitHub often skips or delays one
  workflow_dispatch:
    inputs:
      clips: { description: 'Also render clips', type: boolean, default: true }
permissions:
  contents: write
concurrency: { group: sun, cancel-in-progress: false }
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clips this run?
        id: c
        run: |
          h=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.clips }}" = "true" ] || { [ $((10#$h % 3)) -eq 0 ] && [ $((10#$(date -u +%M))) -lt 45 ]; }; then echo "clips=1" >> $GITHUB_OUTPUT; fi
      - if: steps.c.outputs.clips == '1'
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
      - run: python3 tools/sun_frames.py ${{ steps.c.outputs.clips == '1' && '--clips' || '' }}
      - name: Earth data + daily journal
        env: { NASA_KEY: '${{ secrets.NASA_KEY }}' }   # optional free key from api.nasa.gov (the demo key is often over its limit)
        run: python3 tools/earth_data.py || true
      - name: Publish frame list
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aurora/sun/frames.json aurora/data
          git diff --cached --quiet || { git commit -qm "Sun frames + Earth data $(date -u +%d.%m\ %H:%M)"; git pull -q --rebase; git push -q; }
      # past ENLIL runs (NOAA keeps only the current one) -> branch "enlil", one commit, force-pushed (no history)
      - name: ENLIL archive
        run: |
          if git fetch -q --depth 1 origin enlil; then git worktree add -q --detach arch FETCH_HEAD; else git worktree add -q --orphan -b seed arch; fi
          python3 tools/enlil_archive.py arch
          cd arch
          git checkout -q --orphan snap
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "ENLIL archive $(date -u +%d.%m\ %H:%M)"
          git push -q -f origin snap:enlil
      - name: Upload clips
        if: steps.c.outputs.clips == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          ls clips/*.mp4 >/dev/null 2>&1 || exit 0
          gh release view sun-clips >/dev/null 2>&1 || gh release create sun-clips --title "Sun clips (updated automatically)" --notes "Last 48 hours of each solar filter, refreshed every 3 hours. Data: NASA SDO, SOHO (ESA/NASA), Stanford JSOC." --latest=false
          gh release upload sun-clips clips/*.mp4 --clobber
