# Hourly: frame lists for the aurora page's Sun loops (NASA allows no browser requests). Every 3 h (and on
# demand) also 48-hour MP4 clips per filter, uploaded to the "sun-clips" release (kept out of git history).
name: Sun frames
on:
  schedule: [{ cron: '23 * * * *' }]
  workflow_dispatch:
    inputs:
      clips: { description: 'Also render clips', type: boolean, default: true }
permissions:
  contents: write
concurrency: { group: sun, cancel-in-progress: false }
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clips this run?
        id: c
        run: |
          h=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.clips }}" = "true" ] || [ $((10#$h % 3)) -eq 0 ]; then echo "clips=1" >> $GITHUB_OUTPUT; fi
      - if: steps.c.outputs.clips == '1'
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
      - run: python3 tools/sun_frames.py ${{ steps.c.outputs.clips == '1' && '--clips' || '' }}
      - name: Publish frame list
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aurora/sun/frames.json
          git diff --cached --quiet || { git commit -qm "Sun frames $(date -u +%d.%m\ %H:%M)"; git push -q; }
      - name: Upload clips
        if: steps.c.outputs.clips == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          ls clips/*.mp4 >/dev/null 2>&1 || exit 0
          gh release view sun-clips >/dev/null 2>&1 || gh release create sun-clips --title "Sun clips (updated automatically)" --notes "Last 48 hours of each solar filter, refreshed every 3 hours. Data: NASA SDO, SOHO (ESA/NASA), Stanford JSOC." --latest=false
          gh release upload sun-clips clips/*.mp4 --clobber
