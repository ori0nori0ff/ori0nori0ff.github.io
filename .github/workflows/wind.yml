# Every 6 h: real wind for the 3D Earth (flight + moving clouds): NOAA GFS 1° u / v at 10 m + 8 pressure levels, forecast hours 0-12,
# from the NOMADS grib filter (nomads.ncep.noaa.gov) -> tools/build_wind.py (own GRIB2 decoder, numpy only).
# 5 requests per run, 3 s apart, one retry after 60 s (NOMADS limits the hit rate per client: https://nomads.ncep.noaa.gov/info.php).
# Runs ~4.5 h after each GFS cycle (00 / 06 / 12 / 18Z), when NOMADS has it complete. The output goes to branch "wind" as one
# force-pushed commit (no history growth), read by the page from raw.githubusercontent.com (CORS *, the host the clouds already use).
name: Wind now
on:
  schedule: [{ cron: '33 4,10,16,22 * * *' }]
  workflow_dispatch:
  push: { branches: [main], paths: ['.github/workflows/wind.yml', 'tools/build_wind.py'] }   # run at once when the bot itself changes
permissions:
  contents: write
concurrency: { group: wind, cancel-in-progress: true }
jobs:
  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q numpy==2.3.4
      - run: python3 tools/build_wind.py --out out
      - name: Publish to branch "wind"
        run: |
          cd out
          git init -q -b wind
          git add wind.bin.gz wind.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Wind $(python3 -c 'import json; print(json.load(open("wind.json"))["run"])')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wind:wind
