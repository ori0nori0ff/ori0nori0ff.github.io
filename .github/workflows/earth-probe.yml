# temporary: field formats
name: Earth probe
on: { push: { paths: ['.github/workflows/earth-probe.yml'] }, workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 "https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=GVP-VOTW:Smithsonian_VOTW_Holocene_Eruptions&outputFormat=application/json&count=5000&cql_filter=StartDateYear%3E%3D2023" | python3 -c "
          import json,sys; d=json.load(sys.stdin); f=[x['properties'] for x in d['features']]; print(len(f))
          for p in f[:12]: print({k:p[k] for k in ['Volcano_Name','StartDateYear','StartDateMonth','EndDateYear','EndDateYearModifier','EndDateMonth','EndDateDay','Activity_Type']})"
          curl -s -m 60 "https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json" | head -c 400; echo
          curl -s -m 60 "https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/CMEAnalysis?startDate=2026-10-05&endDate=2026-10-18&mostAccurateOnly=true&speed=0&halfAngle=0&catalog=ALL" | head -c 700; echo
